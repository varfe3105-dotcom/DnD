<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Charakterbogen</title>
<style>
:root{--bg:#efe4cc;--panel:#f8f1de;--ink:#2b2118;--mute:#7a6a55;--line:#c4b08a;--acc:#8a2a2a;--accink:#fff7e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130f;--panel:#221c16;--ink:#eadfc8;--mute:#a49478;--line:#4d402e;--acc:#d9a441;--accink:#17130f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17130f;--panel:#221c16;--ink:#eadfc8;--mute:#a49478;--line:#4d402e;--acc:#d9a441;--accink:#17130f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
main{max-width:980px;margin:0 auto;padding:18px 14px 56px}
h1,h2{margin:0;font-weight:700}
h1{font-size:2rem;line-height:1.15}
header{border-bottom:3px double var(--line);padding-bottom:10px}
header p{margin:2px 0 0;color:var(--mute);font-style:italic}
header input{width:100%;margin-bottom:6px;font-size:1.1rem}
h2{font-size:.85rem;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);display:flex;align-items:center;gap:10px;margin:24px 0 8px}
h2::after{content:"";flex:1;border-top:1px solid var(--line)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button{font:inherit;color:var(--ink);cursor:pointer}
.ghost{background:none;border:1.5px solid var(--ink);border-radius:6px;padding:7px 12px}
.solid{background:var(--acc);color:var(--accink);border:1.5px solid var(--acc);border-radius:6px;padding:8px 14px;font-weight:700}
.rests{display:flex;gap:10px;margin-top:14px}
.rests button{flex:1;padding:11px 8px}
nav{display:flex;gap:2px;margin-top:14px;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:10px 8px;font-weight:700;color:var(--mute);white-space:nowrap}
nav button[aria-selected="true"]{color:var(--acc);border-bottom-color:var(--acc)}
.card,.sb,.ab1{background:var(--panel);border:1.5px solid var(--ink);border-radius:6px;outline:1px solid var(--line);outline-offset:-5px}
.card{padding:10px 14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.sb{padding:9px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.sb small,.ab1 small,.coin small{color:var(--mute);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em}
.sb b{font-size:1.4rem;line-height:1.2}
.sheet{display:grid;gap:14px;grid-template-columns:1fr;margin-top:6px}
.abs{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 8px;margin-top:20px}
.ab1{position:relative;padding:8px 2px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;border-radius:8px 8px 28px 28px}
.ab1 b{font-size:2rem;line-height:1.1;color:var(--acc)}
.ab1 span{position:absolute;left:50%;bottom:-13px;transform:translateX(-50%);min-width:42px;border:1.5px solid var(--ink);border-radius:999px;background:var(--bg);font-size:.95rem;line-height:1.5;padding:0 8px}
.ab1 .num2,.stats .num2{width:52px;text-align:center;padding:3px}
@media (min-width:760px){.sheet{grid-template-columns:150px 1fr;gap:22px}.abs{grid-template-columns:1fr}}
.hp{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hp .num{font-size:3rem;font-weight:700;line-height:1;text-align:center;flex:1}
.hp .num small{font-size:1.1rem;color:var(--mute);font-weight:400}
.hp button{width:52px;height:52px;border-radius:8px;border:1.5px solid var(--ink);background:var(--bg);font-size:1.6rem;font-weight:700}
.bar{height:8px;border-radius:2px;background:var(--line);margin:10px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .ic{font-size:1.5rem;width:34px;text-align:center;flex:none}
.row .nm{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:700}
.row .nm small{display:block;color:var(--mute);font-size:.85rem;font-weight:400;line-height:1.35}
.pips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.pip{width:26px;height:26px;border:2px solid var(--ink);border-radius:5px;background:var(--bg);padding:0;position:relative}
.pip:not(.on){background:var(--line)}
.pip:not(.on)::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;color:var(--acc);font-weight:700;line-height:1}
.slotrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.slotrow:first-child{border-top:0}
.slotrow b{width:70px;flex:none}
.edit input[type=text]{flex:1;width:100%}
.edit .ic input{width:44px;text-align:center;padding:5px 2px}
.num2{width:58px}
.del{background:none;border:0;color:var(--acc);font-size:1.2rem;padding:4px 8px}
.addbox{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.add{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.add input,.add select{flex:1;min-width:110px}
.add input[id$="-p"]{flex-basis:100%}
.hint{color:var(--mute);font-size:.9rem;font-style:italic;margin-top:6px}
summary{cursor:pointer;color:var(--acc);font-weight:700;margin-top:10px}
.hintline{color:var(--mute);font-style:italic;margin:14px 0 0}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:34px;height:34px;border-radius:6px;border:1.5px solid var(--ink);background:var(--bg);font-weight:700}
.coins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 16px}
.coin{display:flex;flex-direction:column;gap:3px}
.badge{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:0 6px;font-size:.78rem;color:var(--mute);font-weight:400;margin-right:6px}
.used{opacity:.45;text-decoration:line-through}
.empty{color:var(--mute);padding:6px 0;font-style:italic}
textarea{width:100%;min-height:55vh;resize:vertical;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--bg);border:1.5px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.9rem}
.chip.on{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:700}
.chips+.row{margin-top:8px}
</style>
</head>

const app=document.getElementById('app');
app.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,i=+b.dataset.i,k=b.dataset.k;
  if(a==='edit')S.edit=!S.edit;
  else if(a==='tab')S.tab=b.dataset.t;
  else if(a==='hp')S.hp=clamp(S.hp+ +b.dataset.d,0,S.hpMax);
  else if(a==='pip'){const o=k==='hd'?S.hd:S[k][i];o.used=clamp(+b.dataset.j<o.max-o.used?o.used+1:o.used-1,0,o.max)}
  else if(a==='rest'){const lng=b.dataset.r==='long';S.res.forEach(r=>{if(r.rest!=='none'&&(lng||r.rest==='short'))r.used=0});if(lng){S.hd.used=Math.max(0,S.hd.used-Math.max(1,Math.floor(S.hd.max/2)));S.slots.forEach(s=>s.used=0);S.spells.forEach(s=>s.used=false);S.hp=S.hpMax}}
  else if(a==='cond'){S.cond[b.dataset.c]=!S.cond[b.dataset.c]}
  else if(a==='exh')S.exh=clamp(S.exh+ +b.dataset.d,0,6);
  else if(a==='gold')S.gold[b.dataset.c]=Math.max(0,S.gold[b.dataset.c]+ +b.dataset.d);
  else if(a==='spused')S.spells[i].used=!S.spells[i].used;
  else if(a==='qty')S.items[i].q=Math.max(0,S.items[i].q+ +b.dataset.d);
  else if(a==='del')S[k].splice(i,1);
  else if(a==='add'){
    const g=b.dataset.g,own=b.dataset.m==='own',v=id=>(document.getElementById(id)||{}).value||'';
    const n=own?v(g+'-n').trim():v(g+'-sel');if(!n)return;
    const c=own?{}:CAT[g][n],ic=own?v(g+'-i'):c.i,p=own?v(g+'-p'):c.p;
    if(g==='res')S.res.push({i:ic||'🧪',n,max:Math.max(1,+v('res-m')||1),used:0,rest:own?(v('res-r')||'long'):'none',p});
    if(g==='sp')S.spells.push({i:ic||'✨',n,lvl:own?clamp(+v('sp-l')||0,0,9):c.lvl,used:false,p});
    if(g==='it')S.items.push({i:ic||'📦',n,q:1,p});
  }
  save();render();
});
app.addEventListener('change',ev=>{
  const el=ev.target;if(!el.dataset.f)return;
  const v=el.type==='number'?Math.max(0,+el.value||0):el.value;
  if(el.dataset.k){const o=el.dataset.i===undefined?S[el.dataset.k]:S[el.dataset.k][+el.dataset.i];o[el.dataset.f]=v;if(o.max!=null&&o.used>o.max)o.used=o.max}
  else{S[el.dataset.f]=v;if(S.hp>S.hpMax)S.hp=S.hpMax}
  save();if(el.type==='number'||el.tagName==='SELECT')render();
});
app.addEventListener('input',ev=>{if(ev.target.id==='notes'){S.notes=ev.target.value;save()}});
app.addEventListener('change',ev=>{const el=ev.target;if(/-sel$/.test(el.id)){const g=el.id.slice(0,-4),c=CAT[g][el.value];const hh=document.getElementById(g+'-hint');if(hh)hh.textContent=c?c.p:''}});
render();
</script>
</body>
