<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>D&amp;D Charakterbogen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans+SC:wght@500;700&family=Grenze+Gotisch:wght@500;700&display=swap">
<style>
/* Layout: Lederband-Kopf mit Porträtmedaillon, darunter Pergament. Attribute als Wappenschilde links, Spielinhalt rechts; Wiki zweispaltig (Liste | Eintrag); am Handy alles einspaltig. */
:root{
  --bg:#ecdfc2;--panel:#f7efd9;--sunk:#e2d1ab;--ink:#2a1e14;--mute:#66563f;--line:#bfa577;--acc:#8b1f1f;--accink:#fff6e3;--good:#3d6a35;--shade:rgba(60,40,10,.18);
  --band:#2b1c12;--bandink:#f3e6c4;--gilt:#d4ab55;--giltdk:#8a6420;
  --steel1:#c9d1da;--steel2:#3c4652;--crim1:#f0786a;--crim2:#5e1212;--arc1:#a99bff;--arc2:#26195f;--gold1:#ffe08a;--gold2:#6e4a0c;--lea1:#c48a5a;--lea2:#3e2312;--ver1:#9ad27f;--ver2:#1d4318;--sha1:#9a96a8;--sha2:#1b1922;
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .2  0 0 0 0 .08  0 0 0 .11 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  --f-disp:"Grenze Gotisch","UnifrakturMaguntia","Iowan Old Style",Palatino,Georgia,serif;
  --f-body:"Alegreya","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --f-ui:"Alegreya Sans SC","Gill Sans","Trebuchet MS",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16110c;--panel:#221a12;--sunk:#19130d;--ink:#ecdfc4;--mute:#a8977a;--line:#4f3f2b;--acc:#e0ae4a;--accink:#16110c;--good:#8fbf7a;--shade:rgba(0,0,0,.5);--band:#0d0906;--bandink:#f0e2bd;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16110c;--panel:#221a12;--sunk:#19130d;--ink:#ecdfc4;--mute:#a8977a;--line:#4f3f2b;--acc:#e0ae4a;--accink:#16110c;--good:#8fbf7a;--shade:rgba(0,0,0,.5);--band:#0d0906;--bandink:#f0e2bd;color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font:17px/1.45 var(--f-body);background:var(--grain),radial-gradient(ellipse 120% 90% at 50% 30%,transparent 55%,var(--shade)),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1120px;margin:0 auto;padding-block:16px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:7px 9px;min-width:0}
:is(input,select,textarea,button,summary,label,[tabindex]):focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.i{width:1.4em;height:1.4em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Spiel-Icons: Seltenheitsrahmen mit Licht und Schatten */
.tok{display:inline-grid;place-items:center;width:38px;height:38px;flex:none;border-radius:8px;position:relative;
  background:radial-gradient(circle at 32% 26%,var(--t1) 0%,var(--t2) 78%);border:1px solid rgba(0,0,0,.55);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -4px 7px rgba(0,0,0,.4),0 2px 3px rgba(0,0,0,.28)}
.tok::after{content:"";position:absolute;inset:3px 3px 50% 3px;border-radius:6px 6px 40% 40%;background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,0));pointer-events:none}
.tok .i{width:66%;height:66%;stroke:url(#gl);stroke-width:1.9;filter:drop-shadow(0 1.5px 0 rgba(0,0,0,.6))}
.t-steel{--t1:var(--steel1);--t2:var(--steel2)}.t-crimson{--t1:var(--crim1);--t2:var(--crim2)}.t-arcane{--t1:var(--arc1);--t2:var(--arc2)}.t-gold{--t1:var(--gold1);--t2:var(--gold2)}.t-leather{--t1:var(--lea1);--t2:var(--lea2)}.t-verdant{--t1:var(--ver1);--t2:var(--ver2)}.t-shadow{--t1:var(--sha1);--t2:var(--sha2)}
.tok.t-arcane{box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -4px 7px rgba(0,0,0,.4),0 0 0 1px rgba(150,130,255,.5),0 0 8px rgba(130,110,255,.45)}

/* Kopf als Lederband */
.hd{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;padding:16px 18px;background:var(--grain),linear-gradient(160deg,#3d2a1a,var(--band) 60%);color:var(--bandink);border:2px solid var(--gilt);outline:1px solid var(--giltdk);outline-offset:-6px;border-radius:6px;box-shadow:0 6px 18px var(--shade)}
.por{width:92px;height:92px;flex:none;border-radius:50%;overflow:hidden;display:grid;place-items:center;cursor:pointer;background:radial-gradient(circle at 35% 30%,#5a3d26,#1a110a);border:3px solid var(--gilt);box-shadow:0 0 0 2px var(--giltdk),0 0 0 5px rgba(212,171,85,.25),0 4px 10px rgba(0,0,0,.5)}
.por img{width:100%;height:100%;object-fit:cover}
.por span{font:700 2.8rem var(--f-disp);color:var(--gilt)}
.por:hover{filter:brightness(1.1)}
.who{flex:1 1 220px;min-width:0}
h1{font:700 clamp(2.1rem,5.5vw,3.2rem)/1 var(--f-disp);margin:0;color:var(--bandink);text-wrap:balance;text-shadow:0 2px 0 rgba(0,0,0,.45);letter-spacing:.01em}
.who p{margin:6px 0 0;color:var(--gilt);font:700 1rem var(--f-ui);letter-spacing:.05em}
.who .sub2{color:rgba(243,230,196,.7);font:italic 400 .95rem var(--f-body);letter-spacing:0;margin-top:2px}
.seal{width:64px;height:64px;flex:none;border-radius:50%;display:grid;place-content:center;text-align:center;background:radial-gradient(circle at 35% 30%,#c4372f,#6b0f0f 70%);color:#ffe9c9;box-shadow:inset 0 2px 3px rgba(255,255,255,.3),inset 0 -3px 6px rgba(0,0,0,.45),0 3px 6px rgba(0,0,0,.5);transform:rotate(-6deg)}
.seal small{font:700 .62rem var(--f-ui);letter-spacing:.08em;line-height:1}
.seal b{font:700 1.7rem/1 var(--f-disp)}
.hacts{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.rests{display:flex;gap:8px}
.btn{font:700 .92rem var(--f-ui);letter-spacing:.04em;background:transparent;color:var(--ink);border:1.5px solid var(--ink);border-radius:4px;padding:8px 14px;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.solid{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.btn.solid:hover{filter:brightness(1.08)}
.btn.gilt{background:linear-gradient(#ecc66e,#b88a2e);border:1px solid #6e4a0c;color:#2b1a06;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 2px 4px rgba(0,0,0,.4)}
.btn.gilt:hover{filter:brightness(1.07)}
.btn.ghost{color:var(--bandink);border-color:rgba(243,230,196,.55)}
.btn.ghost:hover{background:rgba(243,230,196,.12)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn.good{color:var(--good);border-color:var(--good)}
.btn.bad{color:var(--acc);border-color:var(--acc)}
.btn.warn{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.btn[disabled]{opacity:.45;cursor:default}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:flex;align-items:flex-end;gap:10px;border-bottom:2px solid var(--ink);margin-top:14px;padding-top:6px}
.tabs nav{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs nav button{background:var(--sunk);border:1.5px solid var(--line);border-bottom:0;border-radius:6px 6px 0 0;padding:9px 14px 7px;font:700 1rem var(--f-ui);letter-spacing:.03em;color:var(--mute);white-space:nowrap}
.tabs nav button[aria-selected="true"]{background:var(--panel);color:var(--acc);border-color:var(--ink);position:relative;top:2px;padding-bottom:9px}
.mini{font:700 .9rem var(--f-ui);white-space:nowrap;color:var(--mute);font-variant-numeric:tabular-nums;padding-bottom:8px}
.mini b{color:var(--ink);font-size:1.15rem}
.mini.down b{color:var(--acc)}

h2{font:700 1.45rem/1.1 var(--f-disp);color:var(--acc);display:flex;align-items:center;gap:12px;margin:28px 0 10px}
h2::before{content:"";width:8px;height:8px;background:var(--acc);transform:rotate(45deg);flex:none}
h2::after{content:"";flex:1;height:6px;border-block:1px solid var(--line);order:3}
h2 em{font:500 .85rem var(--f-ui);color:var(--mute);font-style:normal;letter-spacing:.02em;order:2}
.card{position:relative;background:var(--panel);border:2px solid var(--ink);border-radius:3px;box-shadow:inset 0 0 0 4px var(--panel),inset 0 0 0 5px var(--line),0 3px 0 var(--shade);padding:14px 18px}
.card::before,.card::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--acc);pointer-events:none}
.card::before{top:7px;left:7px;border-right:0;border-bottom:0}
.card::after{bottom:7px;right:7px;border-left:0;border-top:0}
.empty,.hint,.note{color:var(--mute);font-style:italic}
.empty{padding:6px 0}
.hint{font-size:.92rem;margin:6px 0 0;min-height:1.2em}
.note{font-size:.9rem;margin:8px 0 0}
.lbl{font:500 .82rem var(--f-ui);color:var(--mute);letter-spacing:.03em}

/* Werte */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px;margin-top:16px}
.st{background:var(--panel);border:2px solid var(--ink);box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 4px var(--line);border-radius:3px;padding:9px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.st small{font:500 .8rem var(--f-ui);color:var(--mute)}
.st b{font:700 1.6rem/1.15 var(--f-body);font-variant-numeric:tabular-nums}
.sheet{display:grid;gap:4px 26px;grid-template-columns:minmax(0,1fr);margin-top:4px}
.col{min-width:0}
.abs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 8px;margin-top:24px}
.abw{display:flex;flex-direction:column;align-items:center;gap:6px}
.ab{width:100%;max-width:130px;padding:2px;background:var(--ink);clip-path:polygon(0 0,100% 0,100% 64%,50% 100%,0 64%)}
.abi{background:linear-gradient(var(--panel),var(--sunk));clip-path:polygon(0 0,100% 0,100% 64%,50% 100%,0 64%);padding:8px 4px 30px;text-align:center;display:flex;flex-direction:column;align-items:center}
.abi small{font:700 .78rem var(--f-ui);color:var(--mute);letter-spacing:.04em}
.abi b{font:700 2.2rem/1.05 var(--f-body);color:var(--acc);font-variant-numeric:tabular-nums}
.abv{margin-top:-14px;position:relative;min-width:46px;text-align:center;border:2px solid var(--ink);border-radius:999px;background:var(--bg);line-height:1.55;padding:0 8px;font-variant-numeric:tabular-nums;font-weight:700}
.abv .n{width:56px;text-align:center;padding:2px;border:0;background:transparent}
.sv{font:500 .85rem var(--f-ui);color:var(--mute);display:flex;align-items:center;gap:6px}
.sv i{width:10px;height:10px;border:1.5px solid var(--ink);border-radius:50%}
.sv.p{color:var(--ink)}.sv.p i{background:var(--acc);border-color:var(--acc)}
@media (min-width:780px){.sheet{grid-template-columns:176px minmax(0,1fr)}.abs{grid-template-columns:1fr}}

/* Lebenspunkte */
.hpt{display:flex;align-items:center;gap:12px}
.hpn{flex:1;text-align:center;font-variant-numeric:tabular-nums}
.hpn b{font-size:3.4rem;line-height:1;font-weight:700}
.hpn small{font-size:1.2rem;color:var(--mute);margin-left:4px}
.hpn.down b{color:var(--acc)}
.tmp{display:block;font:700 .9rem var(--f-ui);color:var(--good)}
.sq{width:52px;height:52px;border-radius:4px;border:1.5px solid var(--ink);background:var(--bg);font-size:1.7rem;font-weight:700;flex:none}
.bar{display:flex;height:12px;border-radius:6px;background:var(--sunk);margin:12px 0;overflow:hidden;border:1.5px solid var(--ink);box-shadow:inset 0 2px 3px var(--shade)}
.bar i{background:linear-gradient(#c8423a,#7a1414)}.bar u{background:linear-gradient(#8fc178,#3d6a35)}
.hpin{display:flex;flex-wrap:wrap;gap:6px}
.hpin input{width:96px;flex:none}
.hpin .btn{flex:1}
.death{margin-top:12px;padding:10px 12px;border:1.5px dashed var(--acc);border-radius:4px;display:grid;gap:8px}
.death span{font-size:.9rem;color:var(--mute)}
.dsr{display:flex;align-items:center;gap:8px;font:700 .9rem var(--f-ui)}
.dsr span{width:96px;color:var(--ink);font-size:.9rem}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);background:var(--bg);padding:0}
.dot.on{background:var(--good);border-color:var(--good)}
.dsr.f .dot.on{background:var(--acc);border-color:var(--acc)}

/* Zeilen und Kästchen */
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.ic{display:grid;place-items:center;flex:none}
.nm{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:700}
.nm small{display:block;color:var(--mute);font-size:.9rem;font-weight:400;line-height:1.35}
.pips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.pip{width:26px;height:26px;border:2px solid var(--ink);border-radius:4px;background:var(--bg);padding:0;position:relative}
.pip:not(.on){background:var(--sunk)}
.pip:not(.on)::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;color:var(--acc);font-weight:700;line-height:1}
.qty{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.qty button{width:34px;height:34px;border-radius:4px;border:1.5px solid var(--ink);background:var(--bg);font-weight:700}
.qty .n{width:76px;text-align:center}
.qty span{min-width:58px;text-align:center;font-weight:700}
.row>.btn,.sp>.btn{flex:none;width:max-content;justify-self:end}
.atk{text-align:center;min-width:58px}
.atk b{display:block;font-size:1.2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.atk small{font:500 .75rem var(--f-ui);color:var(--mute)}
.conc{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding:10px 14px;border:2px solid var(--acc);border-radius:4px;background:var(--panel)}
.conc small{display:block;font:700 .8rem var(--f-ui);color:var(--acc)}
.conc b{font-size:1.15rem}
.conc span{display:block;font-size:.88rem;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--bg);border:1.5px solid var(--line);border-radius:999px;padding:4px 11px;font:500 .9rem var(--f-ui)}
.chip.on{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:700}
.chips+.row{margin-top:8px;border-top:1px solid var(--line)}
.feat{border-top:1px solid var(--line)}
.feat:first-child{border-top:0}
.feat summary{display:flex;align-items:center;gap:12px;padding:9px 0;color:var(--ink);font:700 1rem var(--f-body);margin:0;list-style:none}
.feat summary::-webkit-details-marker{display:none}
.feat summary .lbl{margin-left:auto}
.feat p{margin:0 0 10px 50px;font-size:.95rem}

/* Zauber */
.lvh{display:flex;align-items:center;gap:12px;padding:12px 0 6px;border-top:1px solid var(--line)}
.lvh:first-child{border-top:0;padding-top:4px}
.lvh b{font:700 1.25rem var(--f-disp);color:var(--acc)}
.lvh small{font:500 .85rem var(--f-ui);color:var(--mute);flex:1}
.sp{display:grid;grid-template-columns:minmax(0,1fr) max-content;align-items:center;gap:4px 10px;padding:5px 0 5px 6px;border-left:3px solid transparent}
.sp.cc{border-left-color:var(--acc)}
.sph{display:flex;align-items:center;gap:12px;background:none;border:0;padding:3px 0;text-align:left;min-width:0}
.sph .nm small{font-size:.86rem}
.spb{grid-column:1/-1;padding:4px 0 10px 52px;font-size:.96rem}
.spb p{margin:0 0 6px}
.src{font-size:.82rem;color:var(--mute);font-style:italic}
.cls{font:500 .82rem var(--f-ui);color:var(--mute)}
.skl{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:0 20px}
.sk{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dotted var(--line)}
.sk span{flex:1;min-width:0;font-weight:500}
.sk span small{color:var(--mute);font-weight:400;font-size:.82rem;margin-left:6px}
.sk b{font-variant-numeric:tabular-nums}
.m{width:10px;height:10px;border:1.5px solid var(--ink);border-radius:50%;flex:none}
.m.m1{background:var(--acc);border-color:var(--acc)}
.m.m2{background:var(--acc);border-color:var(--acc);box-shadow:0 0 0 2px var(--panel),0 0 0 3.5px var(--acc)}

/* Inventar */
.coins{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 16px}
.coin{display:flex;flex-direction:column;gap:3px}
.invg{display:grid;gap:0 28px;grid-template-columns:minmax(0,1fr)}
@media (min-width:860px){.invg{grid-template-columns:auto minmax(0,1fr)}}
.doll,.bag{background:var(--grain),linear-gradient(160deg,#3a2818,#1d130b);border:2px solid var(--gilt);outline:1px solid var(--giltdk);outline-offset:-6px;border-radius:6px;padding:18px}
.doll{display:grid;grid-template-columns:repeat(3,76px);grid-template-areas:"ring1 head neck" "main body off" "ring2 cloak hands" ". waist ." ". feet .";gap:8px;justify-content:center}
.bag{display:grid;grid-template-columns:repeat(6,minmax(0,76px));gap:8px;justify-content:center}
.cell{aspect-ratio:1;max-width:100%;position:relative;background:linear-gradient(#17100a,#2a1c11);border:1px solid #5a4126;border-radius:5px;box-shadow:inset 0 3px 6px rgba(0,0,0,.7),0 1px 0 rgba(255,220,150,.08);display:grid;place-items:center;min-width:0}
.cell>small{position:absolute;top:3px;left:0;right:0;text-align:center;font:500 .66rem var(--f-ui);color:#a88c5e;pointer-events:none}
.ph{opacity:.28;display:grid;place-items:center;color:#d8c094}
.ph .i{width:30px;height:30px}
.cell.sel{outline:2px solid var(--gilt);outline-offset:1px}
.cell.over{background:#4a3520}
.cell.no{outline:2px dashed #c4372f;outline-offset:-3px}
.it{position:absolute;inset:3px;width:auto;height:auto;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.eqc .it{top:16px}
.it .i{max-width:34px;max-height:34px}
.it .q{position:absolute;right:4px;bottom:1px;font:700 .82rem var(--f-ui);color:#fff;text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums;z-index:1}
.it .t{position:absolute;left:4px;top:4px;width:7px;height:7px;border-radius:50%;background:var(--gilt);box-shadow:0 0 4px var(--gilt);z-index:1}
.it.lift{opacity:.3}
.dragghost{position:fixed;z-index:50;pointer-events:none;width:58px;height:58px;transform:translate(-50%,-55%);box-shadow:0 8px 20px rgba(0,0,0,.5)}
.dragghost .q,.dragghost .t{display:none}
#tip{position:fixed;z-index:70;max-width:300px;pointer-events:none;background:linear-gradient(#2c1e12,#1a110a);color:#f0e2bd;border:1.5px solid var(--gilt);outline:1px solid #000;border-radius:5px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.55);font-size:.92rem;line-height:1.4}
#tip b{display:block;font:700 1.05rem var(--f-body);color:#fff3d6}
#tip .ttag{display:block;font:500 .8rem var(--f-ui);color:var(--gilt);margin:1px 0 6px}
#tip .ta{display:block;margin-top:6px;font:700 .85rem var(--f-ui);color:#ffd27a}
#tip .tq{display:block;margin-top:6px;color:#bfae8a;font-size:.82rem}
.selp{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:start}
.selp .tok{width:52px;height:52px}
.selp p{margin:4px 0 8px}
.acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:4px}

/* Formulare */
.add{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.add>input,.add>select{flex:1 1 140px}
.add .n{flex:0 0 90px}
.add .wide{flex-basis:100%}
.add .btn{white-space:normal}
.ck{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font:500 .95rem var(--f-ui);min-width:0;max-width:100%}
.ck input[type=file]{max-width:100%;min-width:0}
summary{cursor:pointer;color:var(--acc);font:700 .95rem var(--f-ui);margin-top:12px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px 14px}
.form label{display:flex;flex-direction:column;gap:3px;min-width:0}
.edrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 0;border-top:1px solid var(--line)}
.edrow:first-child{border-top:0}
.edrow input[type=text]{flex:1 1 150px}
.edrow .wide{flex-basis:100%}
.edrow select{flex:0 1 150px}
.n{width:70px}
.del{background:none;border:0;color:var(--acc);font-size:1.2rem;padding:4px 8px}
.tg{background:var(--bg);border:1.5px solid var(--line);border-radius:999px;padding:3px 10px;font:500 .8rem var(--f-ui)}
.tg.on{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.slotg{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.slotg label{display:flex;flex-direction:column;gap:3px}
.porsetup{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.porsetup .por{width:72px;height:72px}
textarea{width:100%;resize:vertical;line-height:1.55}
#notes{min-height:55vh}
#exp,#imp{min-height:120px;font:.82rem/1.4 ui-monospace,Menlo,Consolas,monospace}

/* Wiki */
.wtools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
#wq{flex:1 1 260px}
.wiki{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;margin-top:14px}
.wl{display:flex;flex-direction:column;min-width:0}
.wli{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 8px}
.wli:hover{background:var(--sunk)}
.wli[aria-current="true"]{background:var(--panel);box-shadow:inset 3px 0 0 var(--acc)}
.wli>span:not(.tok){min-width:0;flex:1}
.wli b{display:block;font-weight:700;overflow-wrap:anywhere}
.wli small{display:block;font:500 .8rem var(--f-ui);color:var(--mute)}
.wd{min-width:0}
.wd h3{margin:0;font:700 2rem/1.05 var(--f-disp);color:var(--acc)}
.wdh{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.wdh .tok{width:56px;height:56px}
.wdh small{font:500 .9rem var(--f-ui);color:var(--mute)}
.wd p{margin:8px 0 0;max-width:68ch}
.sm{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 0;padding:10px 0;border-block:1px solid var(--line)}
.sm div{min-width:0}
.sm dt{font:500 .75rem var(--f-ui);color:var(--mute)}
.sm dd{margin:0;font-size:.95rem;overflow-wrap:anywhere}
.lvl{margin-top:14px}
.lvl h4{margin:12px 0 4px;font:700 1.15rem var(--f-disp);color:var(--acc)}
.lvl p{margin:2px 0}
.inl{display:block;padding:4px 10px 14px 58px;border-bottom:1px solid var(--line)}
.inl h3{display:none}
.more{color:var(--mute);font-style:italic;margin-top:12px}
@media (min-width:900px){
  .wiki{grid-template-columns:340px minmax(0,1fr);align-items:start}
  .wl{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 100px);overflow:auto;border:2px solid var(--ink);background:var(--panel);border-radius:3px}
  .inl{display:none}
}
@media (max-width:899px){.wd.pane{display:none}}

/* Stufenaufstieg */
.ovl{position:fixed;inset:0;z-index:80;background:rgba(15,9,4,.7);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.dlg{width:min(760px,100%);max-height:100%;overflow:auto;background:var(--grain),var(--panel);border:2px solid var(--gilt);outline:1px solid var(--giltdk);outline-offset:-7px;border-radius:6px;padding:22px 24px;box-shadow:0 18px 50px rgba(0,0,0,.6)}
.dlg h3{margin:0;font:700 2.2rem/1.05 var(--f-disp);color:var(--acc)}
.dlg h4{margin:18px 0 6px;font:700 1.25rem var(--f-disp);color:var(--ink)}
.dlg .row{padding:7px 0}
.dlgf{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}
.big{font:700 1.4rem var(--f-body);color:var(--good)}
.chg{display:flex;flex-wrap:wrap;gap:6px}
.chg span{border:1px solid var(--line);border-radius:4px;padding:2px 8px;font:500 .9rem var(--f-ui);background:var(--bg)}
.chg span.up{border-color:var(--good);color:var(--good);font-weight:700}

footer{margin-top:40px;padding-top:12px;border-top:3px double var(--line);color:var(--mute);font-size:.88rem}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:90;max-width:min(560px,calc(100% - 32px));background:var(--band);color:var(--bandink);border:1px solid var(--gilt);padding:10px 16px;border-radius:4px;box-shadow:0 6px 20px var(--shade);font-size:.95rem}
.svs{display:none}
@media (max-width:520px){.svl{display:none}.svs{display:inline}.seal{position:absolute;top:12px;right:12px}.who{padding-right:58px}.hd{padding:14px}.por{width:72px;height:72px}.seal{width:54px;height:54px}.seal b{font-size:1.4rem}.hacts{flex-basis:100%}.rests .btn{flex:1}}
@media (max-width:420px){.sq{width:46px;height:46px}.hpn b{font-size:2.8rem}.doll{grid-template-columns:repeat(3,68px)}.tabs nav button{padding-inline:10px}.dlg{padding:18px 16px}}
@media (prefers-reduced-motion:no-preference){.chip,.pip,.btn,.cell,.wli{transition:background-color .12s,color .12s}}

  const o=[],cha=mod(S.abil.cha),R=(n,max,rest,p,ic)=>o.push({n,max,rest,p,ic});
  switch(k){
    case 'Barbarian':R('Rage',l>=20?99:l>=17?6:l>=12?5:l>=6?4:l>=3?3:2,'long',l>=20?`unbegrenzt · Bonusschaden +4`:`Bonusschaden +${l>=16?4:l>=9?3:2}`,'flame');break;
    case 'Bard':R('Bardic Inspiration',Math.max(1,cha),l>=5?'short':'long',`Inspirationswürfel W${l>=15?12:l>=10?10:l>=5?8:6}`,'music');break;
    case 'Cleric':if(l>=2)R('Channel Divinity',l>=18?3:l>=6?2:1,'short','Turn Undead oder Effekt deiner Domäne','star');break;
    case 'Druid':if(l>=2)R('Wild Shape',l>=20?99:2,'short',`Tiergestalt bis HG ${l>=8?'1':l>=4?'1/2':'1/4'}`,'leaf');break;
    case 'Fighter':R('Second Wind',1,'short',`Bonusaktion: 1W10+${l} TP heilen`,'heart');if(l>=2)R('Action Surge',l>=17?2:1,'short','Eine zusätzliche Aktion','bolt');if(l>=9)R('Indomitable',l>=17?3:l>=13?2:1,'long','Misslungenen Rettungswurf wiederholen','shield');break;
    case 'Monk':if(l>=2)R('Ki',l,'short',`Kampfwürfel W${l>=17?10:l>=11?8:l>=5?6:4}`,'swirl');break;
    case 'Paladin':R('Divine Sense',1+Math.max(0,cha),'long','Himmlische, Unholde und Untote spüren','eye');R('Lay on Hands',5*l,'long','Heilpool in TP','heart');if(l>=3)R('Channel Divinity',1,'short','Effekt deines Eides','star');break;
    case 'Rogue':if(l>=20)R('Stroke of Luck',1,'short','Fehlschlag wird Treffer','star');break;
    case 'Sorcerer':if(l>=2)R('Sorcery Points',l,'long','Font of Magic','gem');break;
    case 'Warlock':if(l>=11)R('Mystic Arcanum',l>=17?4:l>=15?3:l>=13?2:1,'long','Je ein hoher Zauber ohne Platz','gem');if(l>=20)R('Eldritch Master',1,'long','Alle Paktplätze zurück','eye');break;
    case 'Wizard':R('Arcane Recovery',1,'long',`Bei kurzer Rast Plätze bis Gesamtgrad ${Math.ceil(l/2)} zurück`,'book');break;
  }
  return o}

/* ---------- Ansichten: Karte ---------- */
function vAbil(edit){
  return `<div class="abs">${AB.map(([k,n])=>{const m=mod(S.abil[k]),sv=m+(S.saves[k]?S.prof:0);
    return `<div class="abw"><div class="ab"><div class="abi"><small>${n}</small><b>${sg(m)}</b></div></div><div class="abv">${edit?numIn('abil.'+k,S.abil[k],n,1,30):S.abil[k]}</div>${edit?`<button class="tg${S.saves[k]?' on':''}" data-a="tsave" data-k="${k}" aria-pressed="${!!S.saves[k]}">RW geübt</button>`:`<div class="sv${S.saves[k]?' p':''}" title="Rettungswurf"><i></i><span class="svl">Rettungswurf</span><span class="svs">RW</span> ${sg(sv)}</div>`}</div>`}).join('')}</div>`}
function vHP(){

  <div class="hpin"><input type="number" id="hpv" min="1" inputmode="numeric" placeholder="Betrag" aria-label="Betrag für Schaden, Heilung oder temporäre TP"><button class="btn bad" data-a="dmg">Schaden</button><button class="btn good" data-a="heal">Heilen</button><button class="btn" data-a="temp">Temp-TP</button></div>

function vDeath(){
  const r=(t,l)=>`<div class="dsr${t==='f'?' f':''}"><span>${l}</span>${[0,1,2].map(j=>`<button class="dot${j<S.death[t]?' on':''}" data-a="ds" data-t="${t}" data-j="${j}" aria-label="${l} ${j+1}"></button>`).join('')}</div>`;
  return `<div class="death"><div><b>Todesrettungswürfe</b><br><span>W20 zu Beginn deines Zuges: ab 10 Erfolg. Eine 1 zählt doppelt, eine 20 bringt 1 TP.</span></div>${r('s','Erfolge')}${r('f','Fehlschläge')}</div>`}
function vCond(){
  const act=COND.filter(c=>S.cond[c[0]]);

function vAtk(){
  const rows=['main','off'].map(k=>S.eq[k]).filter(Boolean).map(it=>{const a=atk(it);if(!a)return '';

function vQuick(){

function vRes(){
  if(!S.res.length)return '';
  return `<h2>Klassenfähigkeiten</h2><div class="card">${S.res.map((r,i)=>`<div class="row"><div class="ic">${tok(r.ic)}</div><div class="nm">${esc(r.n)}<small>${REST[r.rest]||REST.long}${r.p?' · '+esc(r.p):''}</small></div>${r.max>12?`<div class="qty"><button data-a="resd" data-i="${i}" data-d="1" aria-label="Eins verbrauchen">−</button><span>${r.max>=99?'∞':(r.max-r.used)+' / '+r.max}</span><button data-a="resd" data-i="${i}" data-d="-1" aria-label="Eins zurück">+</button></div>`:`<div class="pips">${pips(r.max,r.used,`data-a="pip" data-k="res" data-i="${i}"`)}</div>`}</div>`).join('')}</div>`}
function vFeats(){
  const all=[...raceTraits(),...S.feats];if(!all.length)return '';

function spMeta(s){return [s.time,s.range,s.dur].filter(Boolean).map(esc).join(' · ')}
function vSpells(){
  const lv=new Set(S.spells.map(s=>s.lvl));S.slots.forEach((s,i)=>{if(s.max)lv.add(i+1)});
  if(!lv.size&&!S.pact.max)return `<h2>Zauber</h2><div class="card"><div class="empty">Keine Zauber eingetragen. Im Wiki oder unter „Einrichten“ fügst du welche hinzu.</div></div>`;
  let h='';
  if(S.pact.max)h+=`<div class="lvh"><b>Paktmagie</b><small>Plätze auf Grad ${S.pact.lvl} · zurück nach kurzer Rast</small><div class="pips">${pips(S.pact.max,S.pact.used,'data-a="pip" data-k="pact"')}</div></div>`;
  [...lv].sort((a,b)=>a-b).forEach(l=>{
    const sl=l?S.slots[l-1]:null;
    h+=`<div class="lvh"><b>${l?'Grad '+l:'Cantrips'}</b><small>${l?(sl.max?`${sl.max-sl.used} von ${sl.max} Plätzen frei`:'keine eigenen Plätze'):'beliebig oft'}</small>${sl&&sl.max?`<div class="pips">${pips(sl.max,sl.used,`data-a="pip" data-k="slots" data-i="${l-1}"`)}</div>`:''}</div>`;
    S.spells.map((s,i)=>[s,i]).filter(x=>x[0].lvl===l).sort((a,b)=>a[0].n.localeCompare(b[0].n)).forEach(([s,i])=>{

      h+=`<div class="sp${S.conc===s.n?' cc':''}"><button class="sph" data-a="spopen" data-i="${i}" aria-expanded="${!!o}">${tok(s.ic)}<span class="nm">${esc(s.n)}<small>${spMeta(s)||'Details antippen'}</small></span></button><button class="btn sm" data-a="cast" data-i="${i}">${S.conc===s.n?'Aktiv':'Wirken'}</button>${o?`<div class="spb"><p>${esc(s.eff)}</p>${s.school?`<p class="cls">${esc(s.school)}${s.cls?' · '+s.cls.split('').map(c=>CLN[c]).join(', '):''}</p>`:''}<p class="src">${s.src==='own'?'Eigener Eintrag.':'Zusammenfassung in eigenen Worten, bei Unklarheit im Buch prüfen.'}</p></div>`:''}</div>`})});
  return `<h2>Zauber</h2><div class="card">${h}<p class="note">„Wirken“ kreuzt den niedrigsten passenden Platz an (Paktmagie zuerst) und setzt bei Konzentrationszaubern die Konzentration.</p></div>`}
function vSkills(){

function vMain(){
  const a=S.abil,st=(l,v)=>`<div class="st"><small>${l}</small><b>${v}</b></div>`;
  let h='';
  if(S.conc)h+=`<div class="conc"><div><small>Konzentration</small><b>${esc(S.conc)}</b><span>Bei Schaden: KON-Rettungswurf, SG 10 oder halber Schaden.</span></div><button class="btn" data-a="concend">Beenden</button></div>`;
  h+=`<div class="stats">${st('Rüstungsklasse',S.ac)}${st('Initiative',sg(mod(a.dex)))}${st('Tempo',fmtM(S.speed)+' m')}${st('Übungsbonus',sg(S.prof))}${st('Passive Wahrnehmung',10+skv('Perception'))}</div>`;
  h+=`<div class="sheet"><aside>${vAbil(false)}</aside><div class="col">${vHP()}${vCond()}${vAtk()}${vQuick()}${vRes()}${vSpells()}${vFeats()}${vSkills()}</div></div>`;

/* ---------- Inventar ---------- */
function cell(r,label,area){

function vInv(){

const WFS=[['all','Alle'],['mine','Mein Bogen'],['spell','Zauber'],['class','Klassen'],['race','Völker'],['potion','Tränke'],['magic','Magische Gegenstände'],['item','Ausrüstung'],['cond','Zustände'],['rule','Regeln']];

  return [...S.spells.map(s=>Object.assign({k:'spell',mine:1,c:s.lvl?'Grad '+s.lvl:'Cantrips'},s)),
    ...refs().map(r=>{const it=get(r);return {k:'item',mine:1,n:it.n,ic:it.ic,tone:itTone(it),p:it.p,c:r.startsWith('eq')?'Ausgerüstet':'Rucksack'}}),
    ...S.res.map(r=>({k:'res',mine:1,n:r.n,ic:r.ic,p:r.p,c:'Klassenfähigkeit · '+(REST[r.rest]||'')})),

    ...COND.filter(c=>S.cond[c[0]]).map(c=>BYN['cond:'+c[0]])].map((e,i)=>Object.assign({},e,{key:'my:'+i+':'+e.n}))}

  let L2=WF==='mine'?myEntries():CAT.filter(e=>WF==='all'||e.k===WF);

const wSub=e=>e.k==='spell'?`${e.lvl?'Grad '+e.lvl:'Cantrip'}${e.school?' · '+e.school:''}${e.conc?' · Konz.':''}${e.ritual?' · Ritual':''}`:e.k==='cond'?e.de:e.c+(e.att?' · Einstimmung':'');

  else if(e.k==='class'){const C=CLASSES[e.n];body=`<dl class="sm"><div><dt>Trefferwürfel</dt><dd>W${C.hd}</dd></div><div><dt>Rettungswürfe</dt><dd>${C.sv.map(k=>AB.find(a=>a[0]===k)[1]).join(', ')}</dd></div><div><dt>Zaubern</dt><dd>${{full:'Vollzauberer',half:'Halbzauberer',pact:'Paktmagie','':'kein Zaubern'}[C.cast]}</dd></div></dl><p><b>${C.subN}</b> ab Stufe ${C.subL}: ${C.subs.join(', ')}.</p><div class="lvl">${Object.entries(C.f).map(([l,fs])=>`<h4>Stufe ${l}</h4>${fs.map(([n,p])=>`<p><b>${esc(n)}.</b> ${esc(p)}</p>`).join('')}`).join('')}<p class="cls">Talent oder Attributserhöhung auf Stufe ${C.asi.join(', ')}. Unterklassen-Merkmale auf Stufe ${C.sl.join(', ')}.</p></div><p class="src">Zusammenfassung in eigenen Worten, bei Unklarheit im Buch prüfen.</p>`}

function openLU(){
  if(!CLASSES[S.klass]){S.tab='setup';toast('Erst unter „Einrichten“ eine Klasse wählen.');return}
  const to=(S.level||0)+1;if(to>20){toast('Stufe 20 ist das Maximum.');return}
  LU={to,hp:'avg',roll:'',asi:'two',a1:'',a2:'',feat:'',sub:S.sub||''};LUfocus=true}
function luData(){
  const C=CLASSES[S.klass],to=LU.to,con=mod(S.abil.con),dw=S.subrace==='Hill Dwarf'?1:0,avg=C.hd/2+1;
  const base=to===1?C.hd:(LU.hp==='roll'?clamp(Math.floor(+LU.roll)||0,1,C.hd):avg);
  const gain=Math.max(1,base+con)+dw;
  const feats=[...(C.f[to]||[])];
  if(to===C.subL)feats.push([C.subN,`Du wählst deine Unterklasse (${C.subs.join(', ')}). Ihre Merkmale stehen im Buch; trag sie unter „Einrichten“ bei den Merkmalen ein.`]);
  else if(C.sl.includes(to))feats.push([(S.sub||C.subN)+': neues Merkmal',`Auf Stufe ${to} bekommst du ein Merkmal deiner Unterklasse. Im Buch nachlesen und den Text unter „Einrichten“ ergänzen.`]);
  const extra=[];
  if(S.klass==='Rogue')extra.push(`Sneak Attack: ${Math.ceil(to/2)}W6`);
  if(S.klass==='Barbarian'&&to===20)extra.push('STR und KON +4 (Maximum 24)');
  return {C,to,gain,base,avg,con,dw,feats,extra,asi:C.asi.includes(to),profOld:S.level?S.prof:pb(0),profNew:pb(to),slotsOld:S.slots.map(s=>s.max),slotsNew:slotsFor(S.klass,to),pact:C.cast==='pact'?pactFor(to):null,res:resFor(S.klass,to),
    cant:[cantripsFor(S.klass,to-1),cantripsFor(S.klass,to)],known:[knownFor(S.klass,to-1),knownFor(S.klass,to)]}}
function vLU(){
  const d=luData(),C=d.C,abOpt=sel=>`<option value="">Attribut …</option>`+AB.map(([k,n])=>`<option value="${k}"${k===sel?' selected':''}>${n} (${S.abil[k]})</option>`).join('');
  const chg=(l,a,b)=>String(a)===String(b)?`<span>${l} ${a}</span>`:`<span class="up">${l} ${a} → ${b}</span>`;
  const sl=d.slotsNew.map((n,i)=>[i+1,d.slotsOld[i],n]).filter(x=>x[1]||x[2]);
  const prepared={Cleric:'wis',Druid:'wis',Wizard:'int',Paladin:'cha'}[S.klass];
  const prepN=prepared?Math.max(1,mod(S.abil[prepared])+(S.klass==='Paladin'?Math.floor(d.to/2):d.to)):0;
  const resOld=Object.fromEntries(S.res.map(r=>[r.n,r.max]));
  return `<div class="ovl" data-a="luclose-bg"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="lu-h">
  <h3 id="lu-h" tabindex="-1">${d.to===1?'Stufe 1':'Stufe '+(d.to-1)+' → '+d.to}</h3><p class="lbl" style="margin:4px 0 0">${S.klass}${S.sub?' · '+esc(S.sub):''}${S.subrace||S.race?' · '+(S.subrace||S.race):''}</p>
  <h4>Trefferpunkte</h4>
  ${d.to===1?`<p>Stufe 1: voller Trefferwürfel (W${C.hd} = ${C.hd}) ${sg(d.con)} KON${d.dw?' +1 Hill Dwarf':''} = <span class="big">${d.gain} TP</span></p><p class="note">KON vorher unter „Einrichten“ eintragen, sie zählt hier mit. Rettungswürfe ${C.sv.map(k=>AB.find(a=>a[0]===k)[1]).join(' und ')} werden als geübt markiert.</p>`
  :`<div class="add"><select id="lu-hp" data-lu="hp" aria-label="Trefferpunkte"><option value="avg"${LU.hp==='avg'?' selected':''}>Durchschnitt nehmen (${d.avg})</option><option value="roll"${LU.hp==='roll'?' selected':''}>Selbst gewürfelt (W${C.hd})</option></select>${LU.hp==='roll'?`<input type="number" class="n" id="lu-roll" data-lu="roll" min="1" max="${C.hd}" value="${esc(LU.roll)}" placeholder="Wurf" aria-label="Gewürfelter Wert">`:''}</div><p>${d.base} ${sg(d.con)} KON${d.dw?' +1 Hill Dwarf':''} = <span class="big">+${d.gain} TP</span> <span class="lbl">(Max-TP ${S.hpMax} → ${S.hpMax+d.gain})</span></p>`}
  ${d.profNew!==d.profOld||d.to===1?`<h4>Übungsbonus</h4><div class="chg">${chg('',sg(d.profOld),sg(d.profNew))}</div>`:''}
  ${d.feats.length||d.extra.length?`<h4>Neue Merkmale</h4>${d.feats.map(([n,p])=>`<div class="row">${tok(CLIC[S.klass])}<div class="nm">${esc(n)}<small>${esc(p)}</small></div></div>`).join('')}${d.extra.map(x=>`<div class="row">${tok('star')}<div class="nm">${esc(x)}</div></div>`).join('')}`:''}
  ${d.to===C.subL?`<h4>${C.subN} wählen</h4><div class="add"><input type="text" id="lu-sub" data-lu="sub" list="lu-sub-dl" value="${esc(LU.sub)}" placeholder="${C.subN}" aria-label="${C.subN}"><datalist id="lu-sub-dl">${C.subs.map(s=>`<option value="${esc(s)}">`).join('')}</datalist></div>`:''}
  ${d.asi?`<h4>Attributserhöhung oder Talent</h4><div class="add"><select id="lu-asi" data-lu="asi" aria-label="Art der Erhöhung"><option value="two"${LU.asi==='two'?' selected':''}>+1 auf zwei Attribute</option><option value="one"${LU.asi==='one'?' selected':''}>+2 auf ein Attribut</option><option value="feat"${LU.asi==='feat'?' selected':''}>Talent statt Erhöhung</option></select>
    ${LU.asi==='feat'?`<input type="text" id="lu-feat" data-lu="feat" value="${esc(LU.feat)}" placeholder="Name des Talents, z. B. War Caster" aria-label="Talent">`:`<select id="lu-a1" data-lu="a1" aria-label="Erstes Attribut">${abOpt(LU.a1)}</select>${LU.asi==='two'?`<select id="lu-a2" data-lu="a2" aria-label="Zweites Attribut">${abOpt(LU.a2)}</select>`:''}`}</div><p class="note">Maximum 20. Talente stehen im Player's Handbook, Kapitel 6.</p>`:''}
  ${sl.length?`<h4>Zauberplätze</h4><div class="chg">${sl.map(([g,a,b])=>chg(`Grad ${g}:`,a,b)).join('')}</div>`:''}
  ${d.pact?`<h4>Paktmagie</h4><div class="chg">${chg('',`${S.pact.max} Plätze auf Grad ${S.pact.lvl}`,`${d.pact[0]} Plätze auf Grad ${d.pact[1]}`)}</div>`:''}
  ${d.cant[1]||d.known[1]!=null||prepared?`<h4>Zauber</h4><div class="chg">${d.cant[1]?chg('Cantrips',d.cant[0],d.cant[1]):''}${d.known[1]!=null?chg('bekannte Zauber',d.known[0]||0,d.known[1]):''}${prepared&&(S.klass!=='Paladin'||d.to>=2)?`<span>vorbereitbar: ${prepN}</span>`:''}${S.klass==='Wizard'?`<span class="up">${d.to===1?'6 Zauber im Zauberbuch':'+2 Zauber ins Zauberbuch'}</span>`:''}</div><p class="note">Neue Zauber suchst du danach im Wiki (Filter „Zauber“ und deine Klasse) und fügst sie mit einem Klick hinzu.</p>`:''}
  ${d.res.length?`<h4>Klassenfähigkeiten</h4><div class="chg">${d.res.map(r=>chg(r.n+':',resOld[r.n]==null?'neu':resOld[r.n]>=99?'∞':resOld[r.n],r.max>=99?'∞':r.max)).join('')}</div>`:''}
  <div class="dlgf"><button class="btn" data-a="luclose">Abbrechen</button><button class="btn solid" data-a="luapply">${d.to===1?'Stufe 1 übernehmen':'Aufstieg übernehmen'}</button></div></div></div>`}
function applyLU(){
  const d=luData(),C=d.C,to=d.to;
  if(to>1&&LU.hp==='roll'&&!(+LU.roll>=1)){toast('Bitte den gewürfelten Wert eintragen oder den Durchschnitt nehmen.');return false}
  if(to===C.subL&&!LU.sub.trim()){toast(`Bitte eine Unterklasse (${C.subN}) wählen.`);return false}
  if(d.asi){if(LU.asi==='feat'){if(!LU.feat.trim()){toast('Bitte den Namen des Talents eintragen.');return false}}
    else if(!LU.a1||(LU.asi==='two'&&(!LU.a2||LU.a2===LU.a1))){toast(LU.asi==='two'?'Bitte zwei verschiedene Attribute wählen.':'Bitte ein Attribut wählen.');return false}}
  if(to===1){S.saves={};C.sv.forEach(k=>S.saves[k]=true);S.feats=S.feats.filter(f=>f.src!=='Klasse');S.hpMax=0;S.hp=0;S.hd.used=0}
  S.level=to;S.hpMax+=d.gain;S.hp=Math.min(S.hpMax,S.hp+d.gain);S.hd.max=to;S.hd.die='W'+C.hd;S.prof=d.profNew;S.cls=C.l;
  if(C.cast==='full'||C.cast==='half')d.slotsNew.forEach((m,i)=>{S.slots[i].max=m;S.slots[i].used=Math.min(S.slots[i].used,m)});
  if(d.pact){S.pact.max=d.pact[0];S.pact.lvl=d.pact[1];S.pact.used=Math.min(S.pact.used,S.pact.max)}
  if(to===C.subL)S.sub=LU.sub.trim();
  d.feats.forEach(([n,p])=>S.feats.push({n,p,lvl:to,src:'Klasse'}));
  if(d.asi){if(LU.asi==='feat')S.feats.push({n:LU.feat.trim(),p:'Talent. Wirkung im Buch nachlesen und hier ergänzen.',lvl:to,src:'Talent'});

/* ---------- Spielregeln ---------- */
function damage(d){
  const msg=[],before=S.hp;let r=d;
  if(S.tmp){const t=Math.min(S.tmp,r);S.tmp-=t;r-=t;if(t)msg.push(`${t} von temporären TP abgefangen.`)}
  if(r>0){
    if(before===0){if(r>=S.hpMax)msg.push('Schaden bei 0 TP mindestens so hoch wie die Max-TP: sofortiger Tod.');else{S.death.f=Math.min(3,S.death.f+1);msg.push('Schaden bei 0 TP: ein Fehlschlag beim Todesrettungswurf (bei kritischem Treffer zwei).')}}
    else{S.hp=Math.max(0,before-r);if(S.hp===0){S.cond.Unconscious=true;msg.push(r-before>=S.hpMax?'Restschaden mindestens so hoch wie die Max-TP: sofortiger Tod nach Regelwerk.':'0 TP: bewusstlos, Todesrettungswürfe beginnen.')}}}
  if(S.conc){if(S.hp===0){msg.push(`Konzentration auf ${S.conc} endet.`);S.conc=''}else msg.unshift(`Konzentration auf ${S.conc}: KON-Rettungswurf SG ${Math.max(10,Math.floor(d/2))}.`)}
  toast(msg.join(' ')||`${d} Schaden.`)}
function heal(d){if(S.hp===0){S.death={s:0,f:0};delete S.cond.Unconscious}S.hp=Math.min(S.hpMax,S.hp+d);toast(`${d} TP geheilt.`)}
function rest(long){
  S.res.forEach(r=>{if(r.rest==='short'||(long&&r.rest==='long'))r.used=0});
  S.pact.used=0;
  if(!long){toast('Kurze Rast: Fähigkeiten mit „kurze Rast“'+(S.pact.max?' und Paktmagie':'')+' sind zurück. Trefferwürfel ausgeben: Kästchen ankreuzen, Ergebnis bei „Heilen“ eintragen.');return}
  const back=Math.max(1,Math.floor(S.hd.max/2));
  S.hd.used=Math.max(0,S.hd.used-back);S.slots.forEach(s=>s.used=0);S.hp=S.hpMax;S.tmp=0;S.death={s:0,f:0};S.conc='';delete S.cond.Unconscious;
  let m=`Lange Rast: TP voll, Zauberplätze und Fähigkeiten zurück, bis zu ${back} Trefferwürfel zurück.`;
  if(S.exh>0){S.exh--;m+=' Exhaustion um 1 gesenkt (gilt nur mit Essen und Trinken).'}
  const left=COND.filter(c=>S.cond[c[0]]).map(c=>c[0]);
  if(left.length)m+=` ${left.join(', ')} bleibt aktiv: Zustände enden nicht durch die Rast, sondern wenn ihre Ursache endet.`;
  toast(m)}
function cast(i){
  const s=S.spells[i];
  if(s.lvl>0){
    let msg='';
    if(S.pact.max&&S.pact.used<S.pact.max&&S.pact.lvl>=s.lvl){S.pact.used++;msg=`Paktmagie-Platz (Grad ${S.pact.lvl}) verbraucht.`}
    else{for(let l=s.lvl;l<=9;l++){const sl=S.slots[l-1];if(sl.used<sl.max){sl.used++;msg=`Platz Grad ${l} verbraucht.`;break}}}
    if(!msg){toast(`Kein freier Zauberplatz ab Grad ${s.lvl}.${s.ritual?' Als Ritual geht es ohne Platz (10 Min länger).':''}`);return}
    if(s.conc){msg+=S.conc&&S.conc!==s.n?` Konzentration wechselt von ${S.conc} zu ${s.n}.`:` Konzentration auf ${s.n}.`;S.conc=s.n}
    toast(msg);return}
  if(s.conc){toast(S.conc&&S.conc!==s.n?`Konzentration wechselt von ${S.conc} zu ${s.n}.`:`Konzentration auf ${s.n}.`);S.conc=s.n}
  else toast(`${s.n} gewirkt.`)}
function move(from,to){
  if(from===to)return;const a=get(from),b=get(to);if(!a)return;
  if(!fits(a,to)){toast(`${a.n} passt nicht auf „${slotLabel(to)}“.`);return}
  if(b&&a.cons&&b.cons&&a.n===b.n&&a.p===b.p&&to.startsWith('bag')){b.q+=a.q;set(from,null);if(SEL===from)SEL=to;return}
  if(b&&!fits(b,from)){toast(`Belegt: ${b.n} kann nicht auf „${slotLabel(from)}“. Erst woanders ablegen.`);return}
  set(to,a);set(from,b);
  if(SEL===from)SEL=to;else if(SEL===to)SEL=from;
  const m=S.eq.main;if(m&&/Zweihändig/.test(m.p)&&S.eq.off)toast(`Hinweis: ${m.n} ist zweihändig, die Nebenhand ist aber belegt.`)}
function use(r){
  const it=get(r);if(!it)return;it.q--;
  if(it.q<=0){set(r,null);if(SEL===r)SEL=null;toast(`${it.n}: ${it.p} · Das war das letzte Stück.`)}
  else toast(`${it.n}: ${it.p} · Noch ${it.q}.`)}
function importText(txt){
  let o;try{o=JSON.parse(txt)}catch(e){toast('Das ist kein gültiger Export. Bitte den kompletten Text einfügen.');return false}
  if(!o||typeof o!=='object'){toast('Das ist kein gültiger Export.');return false}
  if(o.v>=3)S=norm(o);else if(o.abil||o.hpMax!=null)S=migrate(o);else{toast('Format nicht erkannt. Erwartet wird ein Export aus diesem Bogen.');return false}
  S.tab='setup';OPEN={};SEL=null;EXP='';toast(`${S.name} importiert.`);return true}
function loadPortrait(file){
  if(!file||!/^image\//.test(file.type)){toast('Bitte eine Bilddatei wählen.');return}
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const z=320,c=document.createElement('canvas');c.width=c.height=z;const s=Math.min(img.width,img.height);c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/3,s,s,0,0,z,z);URL.revokeObjectURL(url);S.img=c.toDataURL('image/jpeg',.85);save();render();toast('Porträt gespeichert.')};
  img.onerror=()=>{URL.revokeObjectURL(url);toast('Das Bild ließ sich nicht öffnen. Ein JPG oder PNG versuchen.')};
  img.src=url}

app.addEventListener('pointerout',e=>{const it=e.target.closest&&e.target.closest('[data-drag]');if(it&&!it.contains(e.relatedTarget))hideTip()});
app.addEventListener('focusin',e=>{const it=e.target.closest&&e.target.closest('[data-drag]');if(it)showTip(it.dataset.drag,0,0,it)});
app.addEventListener('focusout',e=>{if(e.target.closest&&e.target.closest('[data-drag]'))hideTip()});

/* Ziehen und Ablegen (Maus und Touch) */
let drag=null;
app.addEventListener('pointerdown',e=>{const it=e.target.closest('[data-drag]');if(!it||e.button>0)return;drag={from:it.dataset.drag,x:e.clientX,y:e.clientY,moved:false,el:it,g:null,over:null}});
const clearOver=()=>{if(drag&&drag.over)drag.over.classList.remove('over','no')};
window.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(!drag.moved){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6)return;drag.moved=true;hideTip();const g=document.createElement('div');g.className='dragghost '+drag.el.className.replace('it ','');g.innerHTML=drag.el.innerHTML;document.body.appendChild(g);drag.g=g;drag.el.classList.add('lift')}
  drag.g.style.left=e.clientX+'px';drag.g.style.top=e.clientY+'px';
  const t=document.elementFromPoint(e.clientX,e.clientY),c=t&&t.closest('[data-slot]');
  if(drag.over!==c){clearOver();if(c)c.classList.add(fits(get(drag.from),c.dataset.slot)?'over':'no');drag.over=c}});
window.addEventListener('pointerup',e=>{
  if(!drag)return;const d=drag;clearOver();drag=null;if(d.g)d.g.remove();
  if(d.moved){const t=document.elementFromPoint(e.clientX,e.clientY),c=t&&t.closest('[data-slot]');if(c)move(d.from,c.dataset.slot)}
  else{SEL=SEL===d.from?null:d.from;CONF=null}
  save();render()});
window.addEventListener('pointercancel',()=>{if(!drag)return;clearOver();if(drag.g)drag.g.remove();drag=null;render()});

render();
</script>

</body></html>
